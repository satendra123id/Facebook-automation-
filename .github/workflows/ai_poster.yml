name: AI Auto Post
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and Post
        run: |
          # 1. Gemini से कंटेंट लेना
          RAW_RES=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"contents": [{"parts":[{"text": "Write a short motivation in Hindi"}]}]}')
          
          echo "Full AI Response: $RAW_RES"

          AI_TEXT=$(echo $RAW_RES | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$AI_TEXT" ]; then
            echo "❌ AI Error: API Key check karein ya quota khatam ho gaya hai."
            exit 1
          fi

          # 2. Facebook पर पोस्ट
          curl -X POST "https://graph.facebook.com/${{ secrets.FB_PAGE_ID }}/feed" \
          --data-urlencode "message=$AI_TEXT" \
          -d "access_token=${{ secrets.FB_TOKEN }}"
